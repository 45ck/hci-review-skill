name: WebGPU Liquid Glass kit

on:
  pull_request:
    paths:
      - '.github/workflows/liquid-glass.yml'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/liquid-glass/**'
      - 'docs/hci/examples/liquid-glass/**'
      - 'docs/hci/standards/liquid-glass.md'
      - 'docs/hci/examples/README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'scripts/check-glass-standard.mjs'
      - 'scripts/check-standards-models.mjs'
      - 'scripts/check-agent-tasks.mjs'
      - 'scripts/check-agent-contracts.mjs'
      - 'scripts/agent-contract.mjs'
      - 'scripts/agent-action-validation.mjs'
      - 'scripts/agent-documents.mjs'
      - 'scripts/build-liquid-glass.mjs'
      - 'scripts/pack-liquid-glass.mjs'
      - 'scripts/check-liquid-glass-consumer.mjs'
      - 'tests/fixtures/liquid-glass-consumer/**'
      - 'tests/test_liquid_glass_distribution.mjs'
      - 'tests/test_liquid_glass_consumer.py'
      - 'tests/test_consumer_transport.mjs'
      - 'tests/test_material_policy.mjs'
      - 'tests/glass_material_policy_contract.py'
      - 'tests/test_model_controlled.mjs'
      - 'tests/test_agent_documents.mjs'
      - 'tests/test_agent_action_inputs.mjs'
      - 'tests/test_agent_contracts.mjs'
      - 'tests/test_graphics_controlled.mjs'
      - 'tests/glass_agent_inventory_contract.py'
      - 'tests/test_agent_inventory.py'
      - 'docs/hci/standards/agent-engineering.md'
      - 'scripts/check-modelling-profiles.mjs'
      - 'tests/test_glass_browser.py'
      - 'tests/glass_agent_contract.py'
      - 'tests/glass_appearance_contract.py'
      - 'tests/glass_developer_contract.py'
      - 'tests/glass_standards_contract.py'
      - 'tests/glass_model_document_contract.py'
      - 'tests/glass_graphics_contract.py'
      - 'tests/glass_interaction_contract.py'
      - 'tests/glass_sections_contract.py'
      - 'tests/glass_layouts_contract.py'
      - 'tests/test_app_layout_state.mjs'
      - 'docs/hci/standards/app-layout-system.md'
      - 'tests/glass_patterns_contract.py'
      - 'tests/glass_assistant_contract.py'
      - 'tests/glass_catalogue_navigation.py'
      - 'tests/glass_chat_contract.py'
      - 'tests/glass_integrations_contract.py'
      - 'tests/test_chat_adapters.mjs'
      - 'docs/hci/standards/chat-integrations.md'
      - 'docs/hci/standards/library-patterns.md'
      - 'docs/hci/standards/interaction-sections.md'
      - 'docs/hci/standards/standards-components.md'
      - 'docs/hci/standards/agent-first-modeling.md'
      - 'docs/hci/standards/omg-coverage.md'
      - 'docs/hci/standards/developer-components.md'
      - 'docs/hci/models/developer-model-exploration.md'
      - 'tests/glass_optics_contract.py'
      - 'tests/glass_browser_diagnostics.py'
  workflow_dispatch:
    inputs:
      browser_check:
        description: "Exact browser scenario for focused diagnostics; leave empty for the full suite"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: liquid-glass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install locked dependencies and verify catalogue
        id: source
        run: |
          npm ci --ignore-scripts
          npm run glass:verify
      - name: Preserve existing HCI calculator behaviour
        run: python -B -m unittest discover -s tests -v
      - name: Install one browser
        id: browser
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Verify an installed external consumer and bridge lifecycle
        if: github.event_name != 'workflow_dispatch' || inputs.browser_check == ''
        run: |
          npm run glass:consumer -- --online
          python -B tests/test_liquid_glass_consumer.py
      - name: Verify real controls and GPU pixels
        if: (success() || failure()) && steps.source.outcome == 'success' && steps.browser.outcome == 'success'
        shell: bash
        env:
          GLASS_BROWSER_CHECK: ${{ inputs.browser_check || '' }}
          GLASS_EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p test-results
          python -m http.server 4185 --bind 127.0.0.1 --directory docs/hci/examples/liquid-glass/dist >test-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4185/ >/dev/null; then break; fi
            sleep 0.5
          done
          browser_args=(--software-gpu --output test-results/liquid-glass.json)
          if [[ "$GLASS_EVENT_NAME" == "workflow_dispatch" && -n "$GLASS_BROWSER_CHECK" ]]; then
            browser_args+=(--check "$GLASS_BROWSER_CHECK")
          fi
          python -B tests/test_glass_browser.py "${browser_args[@]}"
      - name: Keep concise verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liquid-glass-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/
