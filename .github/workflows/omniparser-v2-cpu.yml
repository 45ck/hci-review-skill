name: OmniParser V2 CPU detector (free public runner)
on:
  push:
    branches:
      - experiment/omniparser-v2-zero-cost
    paths:
      - .github/workflows/omniparser-v2-cpu.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omniparser-v2-cpu
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only Torch (avoid CUDA wheel downloads)
        run: |
          python -m pip install --disable-pip-version-check --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet pillow numpy huggingface_hub
      - name: Fetch Microsoft's official V2 implementation
        run: |
          git clone --filter=blob:none --depth=1 https://github.com/microsoft/OmniParser.git /tmp/OmniParser
      - name: Run official OmniParser V2 YOLOv9-E interactive-region detector (CPU)
        shell: bash
        run: |
          mkdir -p results
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import sys,torch,time,json,traceback
          from huggingface_hub import hf_hub_download
          out=Path("results")
          path=out/"test_ui.png"
          image=Image.new("RGB",(1200,760),"#f4f6f9")
          d=ImageDraw.Draw(image)
          try:
              f=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",19)
              h=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",29)
          except OSError: f=h=ImageFont.load_default()
          d.rounded_rectangle((20,20,270,730),radius=18,fill="#172338")
          d.text((43,54),"Quantitative HCI",font=h,fill="#ffffff")
          for i,t in enumerate(["Overview","Activity","Reports","Settings"]):
              yy=155+i*66
              d.rounded_rectangle((42,yy,247,yy+45),radius=10,fill="#314966" if i==2 else "#172338")
              d.text((60,yy+10),t,font=f,fill="#ffffff")
          d.text((323,54),"Interaction audit",font=h,fill="#172338")
          d.text((323,104),"Select an audit, adjust options or export results.",font=f,fill="#64748b")
          for r,fill,outline,title,txcolor in [
              ((324,160,560,219),"#1663af","#1663af","New analysis","#ffffff"),
              ((584,160,830,219),"#ffffff","#98a3b5","Filter results v","#172338"),
              ((852,160,1134,219),"#eeeeee","#b0b6be","Export (disabled)","#999999"),
          ]:
              d.rounded_rectangle(r,radius=9,fill=fill,outline=outline,width=2)
              d.text((r[0]+28,r[1]+17),title,font=f,fill=txcolor)
          d.rounded_rectangle((324,263,1134,402),radius=13,fill="#ffffff",outline="#d7dce4",width=2)
          d.text((352,284),"Potential mismatches",font=h,fill="#152035")
          d.text((352,333),"9 issues found / Open report >",font=f,fill="#245890")
          d.rounded_rectangle((325,444,700,541),radius=12,fill="#ffffff",outline="#d1d9e3",width=2)
          d.text((350,467),"View details >",font=f,fill="#1f65ac")
          d.text((350,498),"Looks clickable but is static.",font=f,fill="#64748b")
          d.rounded_rectangle((733,444,1134,541),radius=12,fill="#ffffff",outline="#d1d9e3",width=2)
          d.text((759,468),"Advanced filters >",font=f,fill="#172338")
          d.text((759,497),"Discoverability / Keyboard",font=f,fill="#64748b")
          image.save(path)
          report={"source":"microsoft/OmniParser","component":"icon_detect_v3 YOLOv9-E","backend":"TorchScript CPU","true_model_inference":False,"boxes":[]}
          try:
              sys.path.insert(0,"/tmp/OmniParser")
              from util.yolov9 import YOLOv9Detector
              model_file=hf_hub_download(repo_id="microsoft/OmniParser-v2.0",filename="icon_detect_v3/model.pt")
              print("Weights downloaded",Path(model_file).stat().st_size,"bytes",flush=True)
              detector=YOLOv9Detector(model_path=model_file,device="cpu")
              torch.set_num_threads(min(4,torch.get_num_threads()))
              begin=time.monotonic()
              detections=detector.predict(str(path),conf=0.05,imgsz=640,iou=0.1)
              elapsed=round(time.monotonic()-begin,2)
              boxes=detections[0].boxes.xyxy.cpu().numpy().tolist()
              scores=detections[0].boxes.conf.cpu().numpy().tolist()
              entries=[]
              for i,(box,score) in enumerate(zip(boxes,scores)):
                  x1,y1,x2,y2=map(float,box)
                  entries.append({"id":i,"bbox_xyxy":list(map(lambda x:round(x,2),[x1,y1,x2,y2])),"score":round(float(score),4)})
                  d.rectangle((x1,y1,x2,y2),outline="#ff165d",width=2)
                  d.text((x1,max(0,y1-15)),str(i),font=f,fill="#d00543")
              image.save(out/"omniparser_v2_cpu_annotated.png")
              report.update({"true_model_inference":True,"count":len(entries),"elapsed_inference_s":elapsed,"model_checkpoint_bytes":Path(model_file).stat().st_size,"boxes":entries})
              print("OmniParser V2 real detector count",len(entries),"CPU inference seconds",elapsed,flush=True)
              print(json.dumps(entries[:30],indent=2),flush=True)
          except BaseException as exc:
              report["error"]=str(exc)
              report["traceback"]=traceback.format_exc()
              raise
          finally:
              (out/"report.json").write_text(json.dumps(report,indent=2))
          PY
      - name: Preserve screenshot, detections and execution evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omniparser-v2-cpu-results
          path: results/
          retention-days: 7
