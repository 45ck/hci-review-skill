name: HCI review skill pack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check installer syntax
        run: bash -n install.sh uninstall.sh scripts/skill_inventory.sh
      - name: Verify skill contents and isolated install/remove roundtrip
        run: python3 scripts/verify_skill_pack.py
